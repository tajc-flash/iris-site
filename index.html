<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iris</title>
  <meta name="description" content="Iris : recommandations de films, séries, anime, manga, jeux et livres.">
  <style>
    :root { --bg: #faf8f5; --fg: #1d1b19; --muted: #5f5a54; --accent: #9a6b1f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141311; --fg: #ece8e2; --muted: #a8a199; --accent: #d9a54a; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 680px; margin: 0 auto; padding: 56px 16px; }
    h1 { font-size: 34px; margin: 0 0 8px; color: var(--accent); letter-spacing: .04em; }
    p { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>Iris</h1>
  <p>Application Android de recommandations : films, séries, anime, manga, jeux et livres, avec tes amis.</p>
  <ul>
    <li><a href="suppression-compte/">Supprimer son compte et ses données</a></li>
  </ul>
</main>
</body>
</html>
